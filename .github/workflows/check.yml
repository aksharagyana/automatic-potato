name: Check shell scripts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n setup.sh configure-rootless-user.sh shell.sh tests/shell-loader.sh
      - run: shellcheck setup.sh configure-rootless-user.sh shell.sh tests/rootless.sh tests/shell-loader.sh
      - run: bash setup.sh --help
      - run: docker build -f tests/Containerfile -t rhel8-rootless-tests .
      - run: bash tests/shell-loader.sh
